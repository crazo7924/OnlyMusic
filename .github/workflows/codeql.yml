name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 2,5' # Runs every Thursday

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # 1. Set up Java environment required by your Android Gradle Plugin (AGP)
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Initialize and configure the Gradle runner environment
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    # 3. Initialize CodeQL with manual build mode and the custom exclusion config
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: 'java-kotlin'
        build-mode: manual
        config-file: ./.github/codeql/codeql-config.yml

    # 4. Compile all modules with explicit memory allocations for Hilt/Room/KSP
    - name: Manual Gradle Build (Pure Kotlin Multi-Module)
      env:
        GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g -Dorg.gradle.jvmargs=-Xmx6g"
      run: |
        ./gradlew :clean assembleDebug \
          --no-daemon \
          --no-build-cache \
          --parallel \
          --no-configure-on-demand \
          -Dksp.incremental=false

    # 5. Extract CodeQL database and upload results to GitHub Security tab
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:java-kotlin"
