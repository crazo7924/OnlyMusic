---
name: Release
on:
  push:
    tags:
      - v*  # Match semantic versioning (v1.0.0)
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Build Release APK
        run: ./gradlew assembleRelease
      - name: Prepare APK Info
        id: apk_info
        run: |
          # Use tag version for tag pushes; for manual workflow_dispatch runs use the commit SHA to avoid empty version errors
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Use short SHA for readability
            VERSION=${GITHUB_SHA::7}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi

          PACKAGE_NAME=$(grep -oP "applicationId\s*=\s*['\"]?\K[^'\"]*" app/build.gradle.kts || echo "dev.crazo7924.onlymusic")
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ ! -z "$APK_PATH" ]; then
            NEW_NAME="${PACKAGE_NAME}_${VERSION}.apk"
            cp "$APK_PATH" "$NEW_NAME"
            echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
            echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk_info.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
